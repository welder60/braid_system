<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão — Braid System</title>
  <style>
    :root {
      --color-moss:      #2F3B2E;
      --color-forest:    #1E2A1F;
      --color-terracota: #8C4A2F;
      --color-earth:     #5A3A20;
      --color-gold:      #C8A15A;
      --color-sand:      #E7DAC1;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-sand);
      color: var(--color-forest);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--color-moss);
      color: var(--color-sand);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-greeting {
      font-size: 0.85rem;
      color: rgba(231,218,193,0.7);
    }
    .btn-perfil {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.825rem;
      color: var(--color-sand);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid rgba(231,218,193,0.3);
      border-radius: 6px;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn-perfil:hover {
      background: rgba(231,218,193,0.1);
      border-color: rgba(231,218,193,0.6);
    }
    .btn-logout {
      font-size: 0.825rem;
      color: var(--color-sand);
      opacity: 0.7;
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid rgba(231,218,193,0.3);
      border-radius: 6px;
      transition: opacity 0.15s;
    }
    .btn-logout:hover { opacity: 1; }
    main {
      flex: 1;
      padding: 2rem 1.5rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 26 C10 20 14 16 18 18 C22 20 26 16 26 10" stroke="#E7DAC1" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M10 18 C10 14 13 12 16 13 C19 14 22 12 22 8" stroke="#C8A15A" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Gestão</h1>
    </div>
    <div class="header-right">
      {% if user.is_authenticated %}
        <span class="header-greeting">Olá, {{ user.nome }}</span>
        <a href="{% url 'perfil' %}" class="btn-perfil">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
          Perfil
        </a>
      {% endif %}
      <a href="{% url 'logout' %}" class="btn-logout">Sair</a>
    </div>
  </header>

  <main>
    <!-- conteúdo será implementado futuramente -->
  </main>

</body>
</html>
