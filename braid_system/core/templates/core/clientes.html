<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clientes — Braid System</title>
  <style>
    :root {
      --color-moss:      #2F3B2E;
      --color-forest:    #1E2A1F;
      --color-earth:     #5A3A20;
      --color-gold:      #C8A15A;
      --color-sand:      #E7DAC1;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-sand);
      color: var(--color-forest);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--color-moss);
      color: var(--color-sand);
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .header-left { display: flex; align-items: center; gap: 0.75rem; }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
    .btn-back {
      font-size: 0.825rem;
      color: var(--color-sand);
      opacity: 0.7;
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid rgba(231,218,193,0.3);
      border-radius: 6px;
      transition: opacity 0.15s;
    }
    .btn-back:hover { opacity: 1; }
    main { flex: 1; padding: 2rem 1.5rem; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
        <path d="M10 26 C10 20 14 16 18 18 C22 20 26 16 26 10" stroke="#E7DAC1" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M10 18 C10 14 13 12 16 13 C19 14 22 12 22 8" stroke="#C8A15A" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Clientes</h1>
    </div>
    <a href="{% url 'gestao' %}" class="btn-back">← Voltar</a>
  </header>
  <main>
    <!-- conteúdo será implementado futuramente -->
  </main>
</body>
</html>
