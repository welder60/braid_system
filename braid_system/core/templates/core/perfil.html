<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil — Braid System</title>
  <style>
    :root {
      --color-moss:      #2F3B2E;
      --color-forest:    #1E2A1F;
      --color-terracota: #8C4A2F;
      --color-earth:     #5A3A20;
      --color-gold:      #C8A15A;
      --color-sand:      #E7DAC1;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-sand);
      color: var(--color-forest);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--color-moss);
      color: var(--color-sand);
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; }
    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .header-greeting {
      font-size: 0.85rem;
      color: rgba(231,218,193,0.7);
    }
    .btn-back {
      font-size: 0.825rem;
      color: var(--color-sand);
      opacity: 0.7;
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid rgba(231,218,193,0.3);
      border-radius: 6px;
      transition: opacity 0.15s;
    }
    .btn-back:hover { opacity: 1; }
    main {
      flex: 1;
      padding: 2.5rem 1.5rem;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(30,42,31,0.09);
      padding: 2rem 2.5rem;
      width: 100%;
      max-width: 480px;
    }
    .card h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--color-forest);
      margin-bottom: 1.5rem;
    }
    .info-row {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 1.25rem;
    }
    .info-label {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #999;
    }
    .info-value {
      font-size: 0.95rem;
      color: var(--color-forest);
    }
    .divider {
      border: none;
      border-top: 1px solid rgba(0,0,0,0.08);
      margin: 1.5rem 0;
    }
    .btn-logout {
      display: inline-block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--color-terracota);
      text-decoration: none;
      padding: 0.6rem 1.25rem;
      border: 1.5px solid var(--color-terracota);
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
    }
    .btn-logout:hover {
      background: var(--color-terracota);
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 26 C10 20 14 16 18 18 C22 20 26 16 26 10" stroke="#E7DAC1" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M10 18 C10 14 13 12 16 13 C19 14 22 12 22 8" stroke="#C8A15A" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1>Perfil</h1>
    </div>
    <div class="header-right">
      {% if user.is_authenticated %}
        <span class="header-greeting">{{ user.nome }}</span>
      {% endif %}
      <a href="javascript:history.back()" class="btn-back">← Voltar</a>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>Meu perfil</h2>

      <div class="info-row">
        <span class="info-label">Nome</span>
        <span class="info-value">{{ user.nome }}</span>
      </div>

      <div class="info-row">
        <span class="info-label">E-mail</span>
        <span class="info-value">{{ user.email }}</span>
      </div>

      <div class="info-row">
        <span class="info-label">Tipo de acesso</span>
        <span class="info-value">{{ user.get_tipo_display }}</span>
      </div>

      <hr class="divider">

      <a href="{% url 'logout' %}" class="btn-logout">Sair da conta</a>
    </div>
  </main>

</body>
</html>
