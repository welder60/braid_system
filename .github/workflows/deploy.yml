name: Deploy

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Notify success
        if: success()
        run: echo "✅ Deploy concluído com sucesso no commit ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy falhou! Verifique os logs acima."
