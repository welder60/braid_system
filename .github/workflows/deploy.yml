name: Deploy

on:
  push:
    branches: ["main"]

# Só um deploy por vez. Se já houver um em andamento,
# o job anterior é cancelado ao chegar um push mais novo.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    # Roda SOMENTE se o CI (ci.yml) passou no mesmo commit.
    # Exige que o workflow "CI" esteja configurado como required
    # check na branch protection, ou use needs: ci se preferir
    # combinar tudo num único arquivo.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # necessário para push ao Heroku

      # ──────────────────────────────────────────────────────────
      # HEROKU — descomente e configure se usar Heroku
      # ──────────────────────────────────────────────────────────
      # - name: Deploy to Heroku
      #   uses: akhileshns/heroku-deploy@v3.13.15
      #   with:
      #     heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
      #     heroku_app_name: ${{ secrets.HEROKU_APP_NAME }}
      #     heroku_email: ${{ secrets.HEROKU_EMAIL }}

      # ──────────────────────────────────────────────────────────
      # RENDER — descomente e configure se usar Render
      # Crie um Deploy Hook em: Dashboard > seu serviço > Settings > Deploy Hook
      # Salve a URL em: Settings > Secrets > RENDER_DEPLOY_HOOK_URL
      # ──────────────────────────────────────────────────────────
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # ──────────────────────────────────────────────────────────
      # RAILWAY — descomente e configure se usar Railway
      # ──────────────────────────────────────────────────────────
      # - name: Install Railway CLI
      #   run: npm install -g @railway/cli
      #
      # - name: Deploy to Railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #   run: railway up --service ${{ secrets.RAILWAY_SERVICE }}

      - name: Notify success
        if: success()
        run: echo "✅ Deploy concluído com sucesso no commit ${{ github.sha }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy falhou! Verifique os logs acima."
