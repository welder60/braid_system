name: Docs

on:
  push:
    branches: ["main", "developer"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"

  workflow_dispatch:

# Permissões necessárias para o GitHub Actions fazer o deploy direto
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar MkDocs e plugins
        run: |
          pip install \
            mkdocs-material \
            mkdocs-minify-plugin

      # Valida e gera a pasta "site/" com o HTML pronto
      - name: Validar e Buildar Documentação
        run: mkdocs build --strict

      # Passo Novo 1: Transforma a pasta "site/" em um artefato de deploy (SÓ na main)
      - name: Upload do artefato
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      # Passo Novo 2: Faz o deploy direto na nuvem do GitHub Pages (SÓ na main)
      - name: Deploy para o GitHub Pages
        id: deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v4